name: Crawl Telegram developer data

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-developer-crawler
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: appConfig
    timeout-minutes: 45
    steps:
      - name: Checkout crawler
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in TG_API_ID TG_API_HASH TG_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required environment secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Start Telegram crawl status
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALERT_CHAT_ID: ${{ secrets.TG_ALERT_CHAT_ID }}
        run: |
          id="$(python -m crawler.notifications start)"
          echo "TG_STATUS_MESSAGE_ID=$id" >> "$GITHUB_ENV"

      - name: Collect Telegram configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_SESSION: ${{ secrets.TG_USER_SESSION }}
          TDC_TEST_DC_ENDPOINTS: ${{ secrets.TDC_TEST_DC_ENDPOINTS }}
        run: |
          python -m crawler.notifications update --message-id "$TG_STATUS_MESSAGE_ID" --text "⚙️ Telegram Developer Crawler — 🔐 Collecting MTProto configuration…"
          python -m crawler.mtproto_config

      - name: Collect MTProto TL schemas
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_USER_SESSION: ${{ secrets.TG_USER_SESSION }}
        run: |
          python -m crawler.notifications update --message-id "$TG_STATUS_MESSAGE_ID" --text "⚙️ Telegram Developer Crawler — 📐 Collecting official TL schemas…"
          python -m crawler.tl_schema

      - name: Collect TDLib schema
        run: |
          python -m crawler.notifications update --message-id "$TG_STATUS_MESSAGE_ID" --text "⚙️ Telegram Developer Crawler — 📚 Collecting TDLib schema…"
          python -m crawler.tdlib_schema

      - name: Collect Telegram Desktop schemas
        run: |
          python -m crawler.notifications update --message-id "$TG_STATUS_MESSAGE_ID" --text "⚙️ Telegram Developer Crawler — 🖥️ Collecting Telegram Desktop schemas…"
          python -m crawler.tdesktop_schema

      - name: Collect Android stable and public beta
        run: |
          python -m crawler.notifications update --message-id "$TG_STATUS_MESSAGE_ID" --text "⚙️ Telegram Developer Crawler — 📱 Downloading Android Stable + Public Beta APKs…"
          python -m crawler.android_client

      - name: Extract Android TL schemas
        run: |
          python -m crawler.notifications update --message-id "$TG_STATUS_MESSAGE_ID" --text "⚙️ Telegram Developer Crawler — 🛠️ Decompiling Android APKs with JADX… Stable + Preview"
          python -m crawler.android_tl

      - name: Save generated snapshots
        run: |
          rm -rf /tmp/telegram-developer-data
          cp -a data /tmp/telegram-developer-data
          cp docs/data-branch/README.md /tmp/telegram-developer-data-branch-README.md
          cp docs/modules/mtproto/README.md /tmp/telegram-developer-mtproto-README.md
          cp docs/modules/tdlib/README.md /tmp/telegram-developer-tdlib-README.md
          cp docs/modules/tdesktop/README.md /tmp/telegram-developer-tdesktop-README.md
          cp docs/modules/android/README.md /tmp/telegram-developer-android-README.md
          cp crawler/notifications.py /tmp/telegram-developer-notifications.py
          cp crawler/diff_classifier.py /tmp/telegram-developer-diff-classifier.py

      - name: Publish snapshots to data branch
        run: |
          set -euo pipefail
          git fetch origin data
          python /tmp/telegram-developer-diff-classifier.py \\
            --base data \\
            --output /tmp/telegram-developer-change.md \\
            --json /tmp/telegram-developer-change.json \\
            --notification /tmp/telegram-developer-notification.txt
          if git diff --quiet data -- data; then
            echo "TG_DATA_CHANGED=false" >> "$GITHUB_ENV"
            echo "No generated data changes."
            exit 0
          fi
          git checkout -B data origin/data
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/telegram-developer-data/. .
          cp /tmp/telegram-developer-data-branch-README.md README.md
          mkdir -p data/mtproto data/tdlib data/tdesktop data/android
          cp /tmp/telegram-developer-mtproto-README.md data/mtproto/README.md
          cp /tmp/telegram-developer-tdlib-README.md data/tdlib/README.md
          cp /tmp/telegram-developer-tdesktop-README.md data/tdesktop/README.md
          cp /tmp/telegram-developer-android-README.md data/android/README.md
          mkdir -p data/changes
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp /tmp/telegram-developer-change.md "data/changes/$stamp-change-report.md"
          git config user.name "telegram-developer-crawler[bot]"
          git config user.email "telegram-developer-crawler[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "TG_DATA_CHANGED=false" >> "$GITHUB_ENV"
            echo "No data changes."
            exit 0
          fi
          echo "TG_DATA_CHANGED=true" >> "$GITHUB_ENV"
          python /tmp/telegram-developer-notifications.py delete --message-id "$TG_STATUS_MESSAGE_ID"
          git commit -m "chore(data): update Telegram developer snapshots"
          new_sha="$(git rev-parse HEAD)"
          old_sha="$(git rev-parse HEAD^)"
          git push origin data
          commit_url="https://github.com/abhijeetpatil2122/Telegram-Developer-Crawler/commit/$new_sha"
          compare_url="https://github.com/abhijeetpatil2122/Telegram-Developer-Crawler/compare/$old_sha...$new_sha"
          python /tmp/telegram-developer-notifications.py notify \
            --text "$(cat /tmp/telegram-developer-notification.txt)" \
            --compare-url "$compare_url" \
            --commit-url "$commit_url" || echo "::warning::Telegram final notification failed after data was pushed."

      - name: Finish Telegram crawl status
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALERT_CHAT_ID: ${{ secrets.TG_ALERT_CHAT_ID }}
        run: |
          if [ -n "${TG_STATUS_MESSAGE_ID:-}" ]; then
            python /tmp/telegram-developer-notifications.py delete --message-id "$TG_STATUS_MESSAGE_ID" || true
          fi
