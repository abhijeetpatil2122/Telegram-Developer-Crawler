name: Crawl Telegram developer data

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-developer-crawler
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: appConfig
    timeout-minutes: 45
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_ALERT_CHAT_ID: ${{ secrets.TG_ALERT_CHAT_ID }}
    steps:
      - name: Checkout crawler
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail
          missing=0
          for name in TG_API_ID TG_API_HASH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required environment secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Prepare Telegram notification helper
        run: cp crawler/notifications.py /tmp/telegram-developer-notifications.py

      - name: Start Telegram crawl status
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALERT_CHAT_ID: ${{ secrets.TG_ALERT_CHAT_ID }}
        run: |
          set -euo pipefail
          python -m crawler.notifications start             --progress 5 --stage 1 --total-stages 7             --crawl-number "$GITHUB_RUN_NUMBER" --eta '~1 min'             --title '🚀 Starting crawl'             --detail 'Preparing the crawl.' > /tmp/telegram-status-message-id
          id="$(cat /tmp/telegram-status-message-id)"
          if [ -n "$id" ]; then
            echo "TG_STATUS_MESSAGE_ID=$id" >> "$GITHUB_ENV"
          fi

      - name: Collect Telegram configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_SESSION: ${{ secrets.TG_USER_SESSION }}
          TDC_TEST_DC_ENDPOINTS: ${{ secrets.TDC_TEST_DC_ENDPOINTS }}
        run: |
          python -m crawler.notifications update --message-id "${TG_STATUS_MESSAGE_ID:-}" --progress 20 --stage 2 --total-stages 7 --crawl-number "$GITHUB_RUN_NUMBER" --eta '<30 sec' --title "🔐 MTProto configuration" --detail "Checking Telegram configuration and DC data."
          python -m crawler.mtproto_config

      - name: Collect MTProto TL schemas
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_USER_SESSION: ${{ secrets.TG_USER_SESSION }}
        run: |
          python -m crawler.notifications update --message-id "${TG_STATUS_MESSAGE_ID:-}" --progress 35 --stage 3 --total-stages 7 --crawl-number "$GITHUB_RUN_NUMBER" --eta '<30 sec' --title "📐 Official TL schemas" --detail "Checking the official API and MTProto schemas."
          python -m crawler.tl_schema

      - name: Collect TDLib schema
        run: |
          python -m crawler.notifications update --message-id "${TG_STATUS_MESSAGE_ID:-}" --progress 50 --stage 4 --total-stages 7 --crawl-number "$GITHUB_RUN_NUMBER" --eta '<30 sec' --title "📚 TDLib schema" --detail "Checking the latest TDLib schema."
          python -m crawler.tdlib_schema

      - name: Collect Telegram Desktop schemas
        run: |
          python -m crawler.notifications update --message-id "${TG_STATUS_MESSAGE_ID:-}" --progress 65 --stage 5 --total-stages 7 --crawl-number "$GITHUB_RUN_NUMBER" --eta '<30 sec' --title "🖥️ Telegram Desktop" --detail "Checking the latest Desktop schemas."
          python -m crawler.tdesktop_schema

      - name: Collect Android stable and public beta
        run: |
          python -m crawler.notifications update --message-id "${TG_STATUS_MESSAGE_ID:-}" --progress 78 --stage 6 --total-stages 7 --crawl-number "$GITHUB_RUN_NUMBER" --eta '~1–2 min' --title "📱 Android clients" --detail "Downloading and checking Stable + Preview."
          python -m crawler.android_client

      - name: Extract Android TL schemas
        run: |
          python -m crawler.notifications update --message-id "${TG_STATUS_MESSAGE_ID:-}" --progress 90 --stage 7 --total-stages 7 --crawl-number "$GITHUB_RUN_NUMBER" --eta '~3–4 min' --title "🛠️ Android schema extraction" --detail "Extracting Stable + Preview schemas."
          python -m crawler.android_tl

      - name: Save generated snapshots
        run: |
          set -euo pipefail
          rm -rf /tmp/telegram-developer-data
          cp -a data /tmp/telegram-developer-data
          cp docs/data-branch/README.md /tmp/telegram-developer-data-branch-README.md
          cp docs/modules/mtproto/README.md /tmp/telegram-developer-mtproto-README.md
          cp docs/modules/tdlib/README.md /tmp/telegram-developer-tdlib-README.md
          cp docs/modules/tdesktop/README.md /tmp/telegram-developer-tdesktop-README.md
          cp docs/modules/android/README.md /tmp/telegram-developer-android-README.md
          cp crawler/notifications.py /tmp/telegram-developer-notifications.py
          cp crawler/diff_classifier.py /tmp/telegram-developer-diff-classifier.py
          mkdir -p /tmp/telegram-developer-crawler
          cp -a crawler /tmp/telegram-developer-crawler/crawler

      - name: Publish snapshots to data branch
        run: |
          set -euo pipefail
          git fetch --prune origin data:refs/remotes/origin/data
          python /tmp/telegram-developer-notifications.py update --message-id "${TG_STATUS_MESSAGE_ID:-}" --progress 98 --stage 7 --total-stages 7 --crawl-number "$GITHUB_RUN_NUMBER" --eta '<30 sec' --title "📦 Publishing snapshot" --detail "Publishing the latest snapshot."

          # 5C is part of the publication contract. Never manufacture a
          # developer alert when classification failed.
          PYTHONPATH=/tmp/telegram-developer-crawler python /tmp/telegram-developer-diff-classifier.py             --base origin/data             --output /tmp/telegram-developer-change.md             --json /tmp/telegram-developer-change.json             --notification /tmp/telegram-developer-notification.txt

          # The main checkout contains freshly generated data/. Compare it against
          # the public archive before touching the checkout.
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard -- data)" ]; then
            echo "TG_DATA_CHANGED=false" >> "$GITHUB_ENV"
            echo "No generated data changes."
            exit 0
          fi

          # A failed/restarted run can leave stale worktree metadata behind.
          # Prune it before creating the isolated archive worktree.
          git worktree prune --expire now || true
          publish_dir="/tmp/telegram-developer-data-publish-${GITHUB_RUN_ID}"
          rm -rf "$publish_dir"
          git worktree add --detach "$publish_dir" origin/data
          trap 'git worktree remove --force "$publish_dir" >/dev/null 2>&1 || true; git worktree prune --expire now >/dev/null 2>&1 || true' EXIT

          cd "$publish_dir"
          git clean -fdx

          # The public archive is the branch root. Never publish a nested
          # data/ directory or temporary 5C artifacts.
          rm -rf data changes android mtproto tdlib tdesktop TgAndroid
          cp -a /tmp/telegram-developer-data/. .
          cp /tmp/telegram-developer-data-branch-README.md README.md

          mkdir -p mtproto tdlib tdesktop TgAndroid
          cp /tmp/telegram-developer-mtproto-README.md mtproto/README.md
          cp /tmp/telegram-developer-tdlib-README.md tdlib/README.md
          cp /tmp/telegram-developer-tdesktop-README.md tdesktop/README.md
          cp /tmp/telegram-developer-android-README.md TgAndroid/README.md

          rm -f change.md change.json notification.txt
          rm -rf changes

          git config user.name "telegram-developer-crawler[bot]"
          git config user.email "telegram-developer-crawler[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "TG_DATA_CHANGED=false" >> "$GITHUB_ENV"
            echo "No data changes after archive normalization."
            exit 0
          fi

          echo "TG_DATA_CHANGED=true" >> "$GITHUB_ENV"
          python /tmp/telegram-developer-notifications.py delete --message-id "${TG_STATUS_MESSAGE_ID:-}" || true

          git commit -m "chore(data): update Telegram developer snapshots"
          new_sha="$(git rev-parse HEAD)"
          old_sha="$(git rev-parse HEAD^)"
          git push origin HEAD:data

          commit_url="https://github.com/abhijeetpatil2122/Telegram-Developer-Crawler/commit/$new_sha"
          compare_url="https://github.com/abhijeetpatil2122/Telegram-Developer-Crawler/compare/$old_sha...$new_sha"

          # An empty notification file means 5C found only archive/runtime
          # changes. Do not post a channel message for those changes.
          if [ -s /tmp/telegram-developer-notification.txt ]; then
            python /tmp/telegram-developer-notifications.py notify               --text "$(cat /tmp/telegram-developer-notification.txt)"               --compare-url "$compare_url"               --commit-url "$commit_url"               || echo "::warning::Telegram final notification failed after data was pushed."
          else
            echo "No alert-worthy semantic changes; suppressing final Telegram notification."
          fi

      - name: Finish Telegram crawl status
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALERT_CHAT_ID: ${{ secrets.TG_ALERT_CHAT_ID }}
        run: |
          if [ -n "${TG_STATUS_MESSAGE_ID:-}" ]; then
            python /tmp/telegram-developer-notifications.py delete --message-id "$TG_STATUS_MESSAGE_ID" || true
          fi
