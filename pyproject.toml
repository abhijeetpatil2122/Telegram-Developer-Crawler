[project]
name = "telegram-developer-crawler"
version = "0.1.0"
description = "Developer-focused Telegram change crawler"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "telethon>=1.42,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
tdc-config = "crawler.mtproto_config:main"
